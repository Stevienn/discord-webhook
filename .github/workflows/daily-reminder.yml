name: Daily Romantic Reminder

on:
  schedule:
    # 00:00 UTC = 07:00 WIB
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Reminder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit updated history
        run: |
          git config user.name "daily-reminder-bot"
          git config user.email "daily-reminder-bot@users.noreply.github.com"

          git add history.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update daily reminder history"
            git push
          fi
